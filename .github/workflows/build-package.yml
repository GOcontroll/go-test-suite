name: Build and publish go-test-suite package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE=go-test-suite
          ARCH=all
          BUILD="${RUNNER_TEMP}/${PACKAGE}_${VERSION}_${ARCH}"
          DIST="${RUNNER_TEMP}/dist"

          PKG_DIR="${BUILD}/usr/lib/python3/dist-packages/go_test_suite"
          mkdir -p "${BUILD}/DEBIAN" \
                   "${PKG_DIR}/sounds" \
                   "${BUILD}/usr/bin" \
                   "${DIST}"

          # --- Python package files -----------------------------------------------
          printf '__version__ = "%s"\n' "${VERSION}" \
            > "${PKG_DIR}/__init__.py"
          install -Dm644 go_test_suite/suite.py      "${PKG_DIR}/suite.py"
          install -Dm644 go_test_suite/platform.py   "${PKG_DIR}/platform.py"
          install -Dm644 go_test_suite/test_can.py   "${PKG_DIR}/test_can.py"
          install -Dm644 go_test_suite/test_leds.py  "${PKG_DIR}/test_leds.py"
          install -Dm644 go_test_suite/test_audio.py "${PKG_DIR}/test_audio.py"
          install -Dm644 go_test_suite/test_rtc.py   "${PKG_DIR}/test_rtc.py"
          install -Dm644 go_test_suite/test_display.py "${PKG_DIR}/test_display.py"
          install -Dm644 go_test_suite/test_touch.py   "${PKG_DIR}/test_touch.py"

          # --- Bundled test tone (440 Hz sine, 1s, 16-bit mono 48 kHz) -----------
          python3 - "${PKG_DIR}/sounds/test.wav" << 'PYEOF'
          import math, struct, sys, wave
          out = sys.argv[1]
          rate, dur, freq, amp = 48000, 1.0, 440.0, 0.6
          n = int(rate * dur)
          fade = int(0.01 * rate)
          frames = bytearray()
          for i in range(n):
              g = 1.0
              if i < fade:        g = i / fade
              elif i > n - fade:  g = (n - i) / fade
              s = int(amp * g * 32767 * math.sin(2 * math.pi * freq * i / rate))
              frames += struct.pack('<h', s)
          with wave.open(out, 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              w.writeframes(bytes(frames))
          PYEOF
          chmod 644 "${PKG_DIR}/sounds/test.wav"

          # --- Entry point script -------------------------------------------------
          cat > "${BUILD}/usr/bin/go-test-suite" << 'EOF'
          #!/usr/bin/python3
          from go_test_suite.suite import main
          main()
          EOF
          chmod 755 "${BUILD}/usr/bin/go-test-suite"

          # --- DEBIAN/control -----------------------------------------------------
          cat > "${BUILD}/DEBIAN/control" << CONTROL
          Package: ${PACKAGE}
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: GOcontroll B.V. <info@gocontroll.com>
          Depends: python3, python3-can, python3-netifaces, python3-smbus2, alsa-utils
          Section: utils
          Priority: optional
          Homepage: https://gocontroll.com
          Description: GOcontroll test utility for Moduline controllers
           Post-assembly hardware test runner for GOcontroll Moduline controllers.
           Provides an interactive menu that auto-detects the platform and offers
           the applicable tests: CAN loopback on Moduline Mini / Moduline 4 /
           Moduline Display, LED test on Moduline Mini / Moduline 4, audio output
           test on Moduline Display, RTC tick test where an external battery
           backed RTC is present, a display/GPU test where a connected panel and
           kmscube are found, and a graphical touch test where a multitouch
           digitiser is present.
          CONTROL

          # --- Build --------------------------------------------------------------
          dpkg-deb -Zxz --build --root-owner-group "${BUILD}" \
            "${DIST}/${PACKAGE}_${VERSION}_${ARCH}.deb"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dist/go-test-suite_${{ steps.version.outputs.version }}_all.deb
          generate_release_notes: true

      - name: Trigger go-apt index rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APT_DISPATCH_TOKEN }}
          repository: GOcontroll/go-apt
          event-type: rebuild-index
          client-payload: |
            {
              "package": "go-test-suite",
              "version": "${{ steps.version.outputs.version }}",
              "arch": "all",
              "deb_url": "https://github.com/GOcontroll/go-test-suite/releases/download/${{ github.ref_name }}/go-test-suite_${{ steps.version.outputs.version }}_all.deb"
            }
